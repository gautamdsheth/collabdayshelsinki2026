# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.12/yaml.schema.json
version: v1.12

environmentFolderPath: ./env

provision:
  - uses: teamsApp/create
    with:
      name: Internal Support Escalation${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  - uses: oauth/register
    with:
      name: Work IQ Agent Tools
      appId: ${{TEAMS_APP_ID}}
      flow: authorizationCode
      identityProvider: Custom
      baseUrl: https://agent365.svc.cloud.microsoft/
      authorizationUrl: https://login.microsoftonline.com/2ca837a1-61a6-4011-a2d1-80d50b2494cf/oauth2/v2.0/authorize
      tokenUrl: https://login.microsoftonline.com/2ca837a1-61a6-4011-a2d1-80d50b2494cf/oauth2/v2.0/token
      refreshUrl: https://login.microsoftonline.com/2ca837a1-61a6-4011-a2d1-80d50b2494cf/oauth2/v2.0/token
      scope: ea9ffc3e-8a23-4a7d-836d-234d7c7565c1/.default
      clientId: ${{WORKIQ_CLIENT_ID}}
      clientSecret: ${{SECRET_WORKIQ_CLIENT_SECRET}}
    writeToEnvironmentFile:
      configurationId: MCP_DA_AUTH_ID

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: copilotAgent/publish
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
projectId: febad4a9-fb44-4801-a961-9c057efb282c
